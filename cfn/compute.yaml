            EOF
            systemctl enable kafka
            systemctl start kafka
          - KV: !Ref KafkaVersion
            SV: !Ref ScalaVersion
            KID: !Ref KafkaClusterId

  Broker0Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue cl-cfn-hosted-zone-id
      Name: 'broker-0.cl-cfn.local.'
      Type: A
      TTL: '60'
      ResourceRecords:
        - !GetAtt Broker0.PrivateIp

  Broker1Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue cl-cfn-hosted-zone-id
      Name: 'broker-1.cl-cfn.local.'
      Type: A
      TTL: '60'
      ResourceRecords:
        - !GetAtt Broker1.PrivateIp

  Broker2Record:
    Type: AWS::Route53::RecordSet
    Properties:
      HostedZoneId: !ImportValue cl-cfn-hosted-zone-id
      Name: 'broker-2.cl-cfn.local.'
      Type: A
      TTL: '60'
      ResourceRecords:
        - !GetAtt Broker2.PrivateIp

Outputs:
  Broker0PrivateIP:
    Value: !GetAtt Broker0.PrivateIp
  Broker1PrivateIP:
    Value: !GetAtt Broker1.PrivateIp
  Broker2PrivateIP:
    Value: !GetAtt Broker2.PrivateIp
  BastionPublicIP:
    Value: !GetAtt BastionHost.PublicIp
